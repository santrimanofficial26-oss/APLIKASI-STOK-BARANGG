<!doctype html>
<html lang="{{LANG}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halaman tidak ditemukan · {{NAME}}</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <style>
        :root { --bg: {{BG_LIGHT}}; --teks: #2A2016; --redup: #7A6A58; --brand: {{THEME}}; }
        @media (prefers-color-scheme: dark) { :root { --bg: {{BG_DARK}}; --teks: #F2EEE8; --redup: #9A9288; --brand: #C2966A; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--teks);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: var(--redup); margin: 0 0 18px; }
        a { color: #fff; background: {{THEME}}; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Halaman tidak ditemukan</h1>
        <p>Alamat yang Anda buka tidak ada.</p>
        <a href="/">Buka aplikasi</a>
    </main>
</body>
</html>
